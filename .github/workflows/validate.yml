name: Validate

on:
  workflow_call:

permissions:
  contents: read
  issues: none
  pull-requests: none

jobs:
  validate:
    name: Validate

    env:
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      NGROK_API_KEY: ${{ secrets.NGROK_API_KEY }}
      NGROK_SUBDOMAIN: ${{ github.repository_owner }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: zulu
      - name: Build test coverage
        run: make test
      - name: Build docs
        run: make docs
      - name: Check code
        run: make check
      - name: Validate package
        run: make local
      - name: Test downstream
        run: make test-downstream
      - name: Cleanup temporary test resources
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: make delete-temp-test-resources
      - name: Upload test coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/jacoco/report.xml
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./build/test-results
          files: "test/*.xml"
          report_type: test_results

  publish-docs:
    name: Publish Docs
    needs: validate
    if: github.ref == 'refs/heads/develop'

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: zulu
      - name: Build docs
        run: make docs
      - name: Publish docs
        run: make publish-docs
