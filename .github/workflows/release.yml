name: Release

run-name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  prereq:
    uses: alexdlaird/.github/.github/workflows/release-prereq.yml@main
    with:
      version_file: 'build.gradle'
      version_pattern: 's/^version = ".*"/version = "${VERSION}"/'
      repo_slug: alexdlaird/java-ngrok
      changelog: true
    secrets:
      bot_app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
      bot_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  publish:
    needs: [prereq]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prereq.outputs.squash_commit_sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: zulu

      - name: Publish to Maven Central
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
        run: make upload

  finish:
    needs: [prereq, publish]
    if: always() && needs.prereq.result == 'success'
    uses: alexdlaird/.github/.github/workflows/release-finish.yml@main
    with:
      shipped: ${{ needs.publish.result == 'success' }}
      version: ${{ needs.prereq.outputs.version }}
      squash_commit_sha: ${{ needs.prereq.outputs.squash_commit_sha }}
      squash_boundary_sha: ${{ needs.prereq.outputs.squash_boundary_sha }}
      build_run_id: ${{ needs.prereq.outputs.build_run_id }}
      version_file: 'build.gradle'
      version_pattern: 's/^version = ".*"/version = "${VERSION}"/'
      repo_slug: alexdlaird/java-ngrok
      github_release: true
      github_release_notes: ${{ needs.prereq.outputs.release_notes }}
    secrets:
      bot_app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
      bot_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
